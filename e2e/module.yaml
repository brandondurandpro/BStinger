# What the end-to-end tests of every UI module share: the app launched against a real server (E2eSupport), the
# sample projects, the cost measurements (Cost), and the fixtures of each area. Test code only; never shipped.
product:
  type: jvm/lib

dependencies:
  - //shared: exported
  - //server: exported
  - //plugins/git/git-server
  - //plugins/run/run-server
  - //plugins/terminal/terminal-server
  # The real export of the measures, to a fake collector, for the telemetry chaos tests.
  - //telemetry-otel: exported
  - //lsp: exported
  # The agent settings of the test servers (their ACP registry).
  - //acp: exported
  - //testkit: exported
  - $compose.uiTest: exported
  - $compose.desktop.currentOs: exported
  - $kotlin.test: exported
  # Grammar jars served by the loopback Maven repository of TestGrammars.
  - $libs.tree.sitter.kotlin: exported
  - $libs.tree.sitter.json: exported
  - $libs.tree.sitter.php: exported
  # A real SSH server for the remote development end-to-end tests; the client is the system OpenSSH.
  - $libs.sshd.core: exported
  - $libs.sshd.sftp: exported

settings:
  compose: enabled
