# Local observability stack for kotlin-editor: Alloy (OTLP in) -> Tempo (traces) + Mimir (metrics) -> Grafana.
# Usage: see README.md. Ports are bound to the loopback interface only.
name: kotlin-editor-telemetry

services:
  alloy:
    image: grafana/alloy:v1.5.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
      - "127.0.0.1:12345:12345" # Alloy UI
    depends_on:
      - tempo
      - mimir
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    # The image runs as uid 10001, which cannot write to a fresh named volume; run as root for this local stack.
    user: "0"
    command:
      - -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"   # Tempo HTTP API
    restart: unless-stopped

  mimir:
    image: grafana/mimir:2.14.2
    command:
      - -config.file=/etc/mimir/mimir.yaml
      - -target=all
      - -auth.multitenancy-enabled=false
    volumes:
      - ./mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir-data:/data
    ports:
      - "127.0.0.1:9009:9009"   # Mimir HTTP API (Prometheus API under /prometheus)
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/kotlin-editor.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - tempo
      - mimir
    restart: unless-stopped

volumes:
  alloy-data:
  tempo-data:
  mimir-data:
  grafana-data:
