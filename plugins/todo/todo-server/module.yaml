# The server half of the Todo tool window: scans the files of the project for TODO and FIXME markers.
# Linked statically and found by the server through `META-INF/services` (a bundled plugin).
product:
  type: jvm/lib

dependencies:
  - //server
  - //protocol
  - $libs.kotlinx.coroutines.core
  - $libs.kotlinx.serialization.json

test-dependencies:
  - $kotlin.test
