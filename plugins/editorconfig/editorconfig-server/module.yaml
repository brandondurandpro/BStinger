# The server half of the EditorConfig tool window: checks the open files against `.editorconfig`.
# Linked statically and found by the server through `META-INF/services` (a bundled plugin).
product:
  type: jvm/lib

dependencies:
  - //server
  - //protocol
  - $libs.kotlinx.coroutines.core
  - $libs.kotlinx.serialization.json

test-dependencies:
  - $kotlin.test
