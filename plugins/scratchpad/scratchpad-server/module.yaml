# The server half of the Scratchpad tool window: the notes file of the project, read and written.
# Linked statically and found by the server through `META-INF/services` (a bundled plugin).
product:
  type: jvm/lib

dependencies:
  - //server
  - //protocol
  - $libs.kotlinx.coroutines.core
  - $libs.kotlinx.serialization.json

test-dependencies:
  - $kotlin.test
