# The Scratchpad tool window: the notes file of the project, edited in place and saved on demand.
# State in src/state, UI in src/ui, end-to-end tests in test/.
product:
  type: jvm/lib

dependencies:
  - //features/editor: exported
  - //plugin-api: exported

settings:
  compose: enabled

test-dependencies:
  - //e2e

test-settings:
  jvm:
    test:
      freeJvmArgs:
        - --enable-native-access=ALL-UNNAMED
