# The server half of agent mode. Linked statically and found by the server through `META-INF/services` (a bundled
# plugin).
product:
  type: jvm/lib

dependencies:
  - //server
  - //protocol
  - $libs.kotlinx.coroutines.core
  - $libs.kotlinx.serialization.json
  - //acp
  - //lsp

test-dependencies:
  - //testkit
