product: jvm/app

dependencies:
  - //shared
  - //server
  - //plugins/agent/agent-server
  - //plugins/deploy/deploy-server
  - //plugins/git/git-server
  - //plugins/language-servers/language-servers-server
  - //plugins/run/run-server
  - //plugins/terminal/terminal-server
  # Exports the measures the user agreed to share (OpenTelemetry).
  - //telemetry-otel
  - $compose.desktop.currentOs
  - $compose.preview
  - $libs.kotlinx.coroutines.swing
  - $libs.logback.classic

settings:
  compose: enabled
  jvm:
    mainClass: org.example.kotlineditor.MainKt

plugins:
  packaging:
    enabled: true
    name: kotlin-editor
    displayName: Kotlin Editor
    mainClass: org.example.kotlineditor.MainKt
    description: Kotlin Editor
    vendor: Kotlin Editor
    appImage: true
    # G1 sizes its threads and their queues for the machine (15 threads on 20 cores): 95 MB of resident memory for
    # a heap of a few dozen megabytes, that two threads collect in milliseconds.
    javaOptions:
      - -XX:ParallelGCThreads=2
      - -XX:ConcGCThreads=1
    aot: true
