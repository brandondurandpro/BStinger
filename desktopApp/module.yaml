product: jvm/app

dependencies:
  - //shared
  - //server
  - //plugins/run/run-server
  - //plugins/terminal/terminal-server
  # Exports the measures the user agreed to share (OpenTelemetry).
  - //telemetry-otel
  - $compose.desktop.currentOs
  - $compose.preview
  - $libs.kotlinx.coroutines.swing
  - $libs.logback.classic

settings:
  compose: enabled
  jvm:
    mainClass: org.example.kotlineditor.MainKt

plugins:
  packaging:
    enabled: true
    name: kotlin-editor
    displayName: Kotlin Editor
    mainClass: org.example.kotlineditor.MainKt
    description: Kotlin Editor
    vendor: Kotlin Editor
    appImage: true
    aot: true
