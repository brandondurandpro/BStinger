# The services of the protocol on the wire: the JSON codecs of the model, shared by the client and the server, and
# the client side of each service (RemoteFileSystem, RemoteGit…) over an RpcClient. Only the server and the code
# that connects the IDE to it depend on it; the client modules use `protocol-model`.
product:
  type: jvm/lib

dependencies:
  - //protocol-rpc: exported
  - $libs.kotlinx.coroutines.core
