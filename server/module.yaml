product:
  type: jvm/lib

dependencies:
  - //protocol: exported
  - //plugin-core
  - //lsp
  - //acp
  # Measures its handlers (rpc.server) once a client says the user agreed, exported to OpenTelemetry.
  - //telemetry-otel
  - $libs.kotlinx.coroutines.core
  # Only the JsonElement tree is used (ripgrep's --json output): no compiler plugin needed.
  - $libs.kotlinx.serialization.json
  - $libs.pty4j21
  - $libs.ghostty.linux
  - $libs.directory.watcher

test-dependencies:
  - //testkit

# libghostty-vt and pty4j21 both use the Foreign Function & Memory API.
test-settings:
  jvm:
    test:
      freeJvmArgs:
        - --enable-native-access=ALL-UNNAMED
