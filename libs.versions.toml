[versions]
logback = "1.6.2"
androidx-activity-compose = "1.13.0"
androidx-lifecycle = "2.11.0"
kotlinx-coroutines = "1.11.0"
opentelemetry = "1.45.0"
kotlinx-serialization = "1.9.0"
zstd = "1.5.6-10"
ghostty = "0.1.237"
pty4j21 = "0.22.2"
jtreesitter = "0.26.1"
tree-sitter-kotlin = "0.3.8.1"
tree-sitter-json = "0.24.8"
tree-sitter-php = "0.24.2"
tree-sitter-vue = "0.2.1a"
tree-sitter-typescript = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-dockerfile = "0.2.0"
tree-sitter-yaml = "0.5.0a"
tree-sitter-bash = "0.25.1"
sshd = "2.20.1"
directory-watcher = "0.19.1"
# The Compose version the Kotlin Toolchain uses (`./kotlin show dependencies -m shared`): modules without the Compose
# plugin (syntax, core) take its runtime as a plain library, and must stay on the same version.
compose = "1.12.1"

[libraries]
# OpenTelemetry, configured by hand (no autoconfigure: it relies on ServiceLoader), OTLP over HTTP (no gRPC).
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk", version.ref = "opentelemetry" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp", version.ref = "opentelemetry" }
# Snapshot state and UI types for the modules compiled without the Compose plugin; see the `compose` version.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstd" }
# libghostty-vt: FFM bindings and the native library, generated per platform by GhosttyFX (MIT).
# Only the bindings package is used; the JavaFX classes of the same project are not needed.
# Amper cannot pick a JVM dependency per OS and the per-platform bindings clash: the Linux x86_64 artifact is the
# dependency, the other platforms are vendored as resources under plugins/terminal/terminal-server/resources/ghostty/ (Windows, Linux aarch64,
# macOS x86_64 and aarch64), which also makes one server jar portable to every remote target (see TerminalEngines).
# Update all of them with this version.
ghostty-linux = { module = "io.github.vlaaad:ghosttyfx-linux-x86_64", version.ref = "ghostty" }
pty4j21 = { module = "com.sshtools:pty4j21", version.ref = "pty4j21" }
# tree-sitter: the official FFM binding. Its native runtime is built by tools/tree-sitter/build-runtime (bonede's
# exports only JNI functions on Windows). Grammars are downloaded on demand (see GrammarStore); the two below are test
# fixtures, and must keep the versions of syntax/src/treesitter/GrammarCatalog.kt.
jtreesitter = { module = "io.github.tree-sitter:jtreesitter", version.ref = "jtreesitter" }
tree-sitter-kotlin = { module = "io.github.bonede:tree-sitter-kotlin", version.ref = "tree-sitter-kotlin" }
tree-sitter-json = { module = "io.github.bonede:tree-sitter-json", version.ref = "tree-sitter-json" }
tree-sitter-php = { module = "io.github.bonede:tree-sitter-php", version.ref = "tree-sitter-php" }
tree-sitter-vue = { module = "io.github.bonede:tree-sitter-vue", version.ref = "tree-sitter-vue" }
tree-sitter-typescript = { module = "io.github.bonede:tree-sitter-typescript", version.ref = "tree-sitter-typescript" }
tree-sitter-css = { module = "io.github.bonede:tree-sitter-css", version.ref = "tree-sitter-css" }
tree-sitter-html = { module = "io.github.bonede:tree-sitter-html", version.ref = "tree-sitter-html" }
tree-sitter-dockerfile = { module = "io.github.bonede:tree-sitter-dockerfile", version.ref = "tree-sitter-dockerfile" }
tree-sitter-yaml = { module = "io.github.bonede:tree-sitter-yaml", version.ref = "tree-sitter-yaml" }
tree-sitter-bash = { module = "io.github.bonede:tree-sitter-bash", version.ref = "tree-sitter-bash" }
# Watches the projects: inotify on Linux, a recursive watch on Windows, FSEvents on macOS (the JDK polls there).
directory-watcher = { module = "io.methvin:directory-watcher", version.ref = "directory-watcher" }
# Test-only SSH server: the end-to-end tests connect the real OpenSSH client to it.
sshd-core = { module = "org.apache.sshd:sshd-core", version.ref = "sshd" }
sshd-sftp = { module = "org.apache.sshd:sshd-sftp", version.ref = "sshd" }
