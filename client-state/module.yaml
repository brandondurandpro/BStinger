# The state of the IDE client and its logic (documents, editors, project, Git, terminal, agents...), without the UI:
# compiled without the Compose plugin, and unit tested without compiling any composable.
product:
  type: jvm/lib

dependencies:
  - //protocol: exported
  - //syntax: exported
  # Snapshot state and a few UI state types (LazyListState, FocusRequester), as plain libraries.
  - $libs.compose.runtime: exported
  - $libs.compose.foundation: exported
  - $libs.compose.ui: exported
  - $libs.kotlinx.coroutines.core
