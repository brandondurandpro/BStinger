# The terminal tool window: shell sessions in tabs, screen rendering, keyboard and mouse input.
# State in src/state, UI in src/ui, end-to-end tests in test/.
product:
  type: jvm/lib

dependencies:
  - //ui/kit: exported

settings:
  compose: enabled

test-dependencies:
  - //e2e

test-settings:
  jvm:
    test:
      freeJvmArgs:
        - --enable-native-access=ALL-UNNAMED
