# What every UI module builds on: the theme (colors, fonts, syntax styles), the components, popups, icons, and the
# test tags.
product:
  type: jvm/lib

dependencies:
  - //core: exported
  - $compose.runtime: exported
  - $compose.foundation: exported
  - $compose.material3: exported
  - $compose.ui: exported
  - $compose.components.resources: exported

settings:
  compose:
    enabled: true
    resources:
      packageName: org.example.kotlineditor.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
