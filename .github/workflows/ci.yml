name: CI

# Runs the strict lint and the whole test suite on every supported platform:
# Ubuntu 20.04, 22.04 and 24.04 (under X11 and Wayland), plus Windows.
# The 20.04 GitHub runner image was retired in April 2025, so older Ubuntu
# versions run in their official container image on an ubuntu-24.04 runner.
#
# Each Ubuntu version and session runs the tests in a few jobs side by side,
# one per group of tools/ci/linux-test-groups.txt, and Windows does the same with
# tools/ci/windows-test-groups.txt. A group is a few modules, or a shard of a big
# module (tools/ci/test-shards.txt), of about the same duration. A pull request
# runs two of the six Linux cells (the oldest and newest Ubuntu, one session
# each), or all six when it changes code that differs between them; main runs
# all six after the merge.
#
# Every job restores the build directory saved by the last run of main, so that
# its Build step only compiles what the change touched; only main saves it.
#
# A pull request that only touches documentation skips the lint and the tests.
# Branch protection requires the single "CI passed" check, which succeeds when
# every job either passed or was skipped, so such a pull request can merge.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: "1"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      windows-matrix: ${{ steps.windows.outputs.matrix }}
      linux-matrix: ${{ steps.linux.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Every module must be run exactly once on each platform: whole, or as all of its shards.
      - name: Check the test groups
        run: tools/ci/check-test-groups
      # Pushes and manual runs always test everything.
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE...$HEAD" | tee changed.txt
          if grep -qvE '(\.md$|^docs/)' changed.txt; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      # The Windows jobs: each group of tools/ci/windows-test-groups.txt. The first one saves the build of main.
      - id: windows
        run: |
          matrix=$(grep -vE '^[[:space:]]*(#|$)' tools/ci/windows-test-groups.txt | jq -R . | jq -sc '{include: [
            to_entries[] | {
              steps: .value, group: (.value | split(",") | join(" + ")),
              id: (.value | gsub("[^A-Za-z0-9.]+"; "-")), cache: (.key == 0)
            }
          ]}')
          echo "matrix=$matrix" | tee -a "$GITHUB_OUTPUT"
      # The Linux jobs: each group of tools/ci/linux-test-groups.txt, for each Ubuntu version and display session.
      # The first group of Ubuntu 24.04 under X11 saves the build of main.
      # A pull request tests the six only when it changes what differs between them: the shells of the terminal,
      # the display, the packaging, the CI itself.
      - id: linux
        run: |
          lines() { grep -vE '^[[:space:]]*(#|$)' "$1"; }
          all='[["20.04","x11"],["20.04","wayland"],["22.04","x11"],["22.04","wayland"],["24.04","x11"],["24.04","wayland"]]'
          combos=$all
          platform='^(\.github/workflows/ci\.yml|tools/linux-vm/|run-tests$|kotlin$|plugins/terminal/|desktopApp/|packaging/|tools/ci/check-desktop-app$)'
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && ! grep -qE "$platform" changed.txt; then
            combos='[["24.04","x11"],["20.04","wayland"]]'
          fi
          matrix=$(lines tools/ci/linux-test-groups.txt | jq -R . | jq -sc --argjson combos "$combos" '{include: [
            $combos[] as [$ubuntu, $session] | to_entries[] | {
              ubuntu: $ubuntu, session: $session, steps: .value, group: (.value | split(",") | join(" + ")),
              app: (.value | split(",") | index("non-ui") != null),
              cache: ($ubuntu == "24.04" and $session == "x11" and .key == 0)
            }
          ]}')
          echo "matrix=$matrix" | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Lint (detekt + ktlint)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # detekt 2.x needs a recent JDK; runners default to an older one.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .detekt
          key: detekt-${{ hashFiles('lint', 'detekt.yml') }}
      # The project's own detekt rules are built with the project's toolchain.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.m2/repository
          key: lint-${{ hashFiles('kotlin', 'libs.versions.toml', 'project.yaml', '**/module.yaml') }}
      - run: ./lint

  test-linux:
    name: Linux ${{ matrix.ubuntu }} · ${{ matrix.session }} · ${{ matrix.group }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:${{ matrix.ubuntu }}
      # An init as PID 1 reaps orphaned processes, as on a real system: tests check that killed processes are gone.
      options: --init
      # The image's default POSIX locale makes the JVM reject non-ASCII file names.
      env:
        LANG: C.UTF-8
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.linux-matrix) }}
    steps:
      # Installed before checkout: the official Ubuntu image has no git, and
      # actions/checkout needs it. The 20.04 repositories may have moved to
      # old-releases, so the sources are switched over if the update fails.
      - name: Install system packages
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update || {
            sed -i \
              -e 's|http://archive.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
              -e 's|http://security.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list
            apt-get update
          }
          # Only the display server of the session under test.
          if [ "${{ matrix.session }}" = x11 ]; then display="xvfb"; else display="xwayland weston"; fi
          apt-get install -y --no-install-recommends \
            ca-certificates curl git tar unzip xz-utils openssh-client fish tcsh \
            $display xauth x11-utils \
            libgl1 libx11-6 libxext6 libxrender1 libxtst6 libxi6 \
            fontconfig fonts-dejavu-core
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # In the container, HOME (the ~ of these paths and of the kotlin script, which keeps its own runtime in cli) is
      # /github/home, but the JVM's user.home is /root, from /etc/passwd: the Kotlin CLI puts the JDK, the Maven
      # dependencies (.m2.cache) and its downloads there, and the server its ripgrep.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/JetBrains/Kotlin/cli
            /root/.cache/JetBrains/Kotlin
            !/root/.cache/JetBrains/Kotlin/telemetry
            /root/.m2/repository
          key: linux-${{ matrix.ubuntu }}-${{ hashFiles('kotlin', 'libs.versions.toml', 'project.yaml', '**/module.yaml') }}
      # ripgrep, downloaded and verified on first use by the server (and its tests).
      - uses: actions/cache@v4
        with:
          path: /root/.kotlin-editor/tools
          key: ripgrep-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('server/src/ripgrep/RipgrepRelease.kt') }}
      - name: Start X11 (Xvfb)
        if: matrix.session == 'x11'
        run: |
          Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp -ac &
          # GITHUB_ENV only applies to the next steps: this one needs DISPLAY too.
          export DISPLAY=:99
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do xdpyinfo >/dev/null 2>&1 && break; sleep 1; done
          xdpyinfo | grep -E "name of display|dimensions"
      - name: Start Wayland (headless Weston + XWayland)
        if: matrix.session == 'wayland'
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          # XWayland refuses to start (and Weston then crashes) without the
          # shared socket directory.
          mkdir -p /tmp/.X11-unix
          chmod 1777 /tmp/.X11-unix
          weston --backend=headless-backend.so --xwayland --socket=wayland-ci \
            --width=1600 --height=1000 --idle-time=0 > "$RUNNER_TEMP/weston.log" 2>&1 &
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=wayland-ci" >> "$GITHUB_ENV"
          # AWT has no Wayland backend: the app goes through XWayland, which
          # Weston composites as a Wayland surface.
          echo "DISPLAY=:0" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            [ -S "$XDG_RUNTIME_DIR/wayland-ci" ] && break
            sleep 1
          done
          test -S "$XDG_RUNTIME_DIR/wayland-ci"
          # Connecting an X client starts XWayland.
          for _ in $(seq 1 30); do xdpyinfo -display :0 >/dev/null 2>&1 && break; sleep 1; done
          xdpyinfo -display :0 | grep -E "name of display|dimensions"
      # The build directory of the last run of main (not the packaging output, nor the logs): the build then only
      # compiles what this change touched. The incremental state is the toolchain's own, content-based, but it compares
      # the dates of the files it wrote, which actions/cache keeps to the nanosecond (tar --posix). The three Ubuntu
      # containers share it: the workspace path and the JDK are the same, and the outputs are bytecode.
      - name: Restore the build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/artifacts
            build/generated
            build/ic-cache
            build/incremental.state
            build/tasks
          key: build-linux-${{ hashFiles('kotlin', 'project.yaml') }}-${{ github.sha }}
          restore-keys: build-linux-${{ hashFiles('kotlin', 'project.yaml') }}-
      - name: Build
        run: ./kotlin build
      # Right after the build, so that a failing test does not lose it. Pull requests never save.
      - name: Save the build
        # TEMPORARY: the second condition lets this pull request measure a warm build; removed before the merge.
        if: matrix.cache && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.head_ref, 'ci/faster-pipeline'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/artifacts
            build/generated
            build/ic-cache
            build/incremental.state
            build/tasks
          key: build-linux-${{ hashFiles('kotlin', 'project.yaml') }}-${{ github.sha }}
      - name: Test
        # RUNNER_TEMP is the path inside the container; ${{ runner.temp }} is the host's.
        env:
          STEPS: ${{ matrix.steps }}
        run: JAVA_TOOL_OPTIONS="-XX:ErrorFile=$RUNNER_TEMP/hs_err_%p.log" ./run-tests --only "$STEPS"
      - name: Display server and JVM crash logs
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/weston.log "$RUNNER_TEMP"/hs_err_*.log; do
            [ -f "$f" ] && { echo "::group::$f"; tail -200 "$f"; echo "::endgroup::"; }
          done
          true
      # The tests render off-screen, so this is what proves the desktop app really starts in the session under test:
      # it waits for the window of the app, then checks that the app is still running a few seconds later.
      - name: Desktop app starts in the session
        if: matrix.app
        timeout-minutes: 5
        run: tools/ci/check-desktop-app

  # One job per group of tools/ci/windows-test-groups.txt, whose steps run-tests.bat runs one after the other: a module
  # that hangs (issue #120) fails its own job, with its log and the dumps of the hang watch, and the groups run side
  # by side.
  test-windows:
    name: Windows · ${{ matrix.group }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.windows-matrix) }}
    env:
      # A group takes about 5 minutes on a runner: past this, its run is taken as hung.
      HANG_MINUTES: "15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The whole Kotlin cache, not only cli: the JDK (download.cache, extract.cache) and the Maven dependencies
          # (.m2.cache) are next to it.
          path: |
            ~/AppData/Local/JetBrains/Kotlin
            !~/AppData/Local/JetBrains/Kotlin/telemetry
            ~/.m2/repository
          key: windows-${{ hashFiles('kotlin.bat', 'libs.versions.toml', 'project.yaml', '**/module.yaml') }}
      # ripgrep, downloaded and verified on first use by the server (and its tests).
      - uses: actions/cache@v4
        with:
          path: ~/.kotlin-editor/tools
          key: ripgrep-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('server/src/ripgrep/RipgrepRelease.kt') }}
      # The build directory of the last run of main, as on Linux.
      - name: Restore the build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/artifacts
            build/generated
            build/ic-cache
            build/incremental.state
            build/tasks
          key: build-windows-${{ hashFiles('kotlin.bat', 'project.yaml') }}-${{ github.sha }}
          restore-keys: build-windows-${{ hashFiles('kotlin.bat', 'project.yaml') }}-
      - name: Build
        shell: cmd
        run: kotlin.bat build
      - name: Save the build
        # TEMPORARY: the second condition lets this pull request measure a warm build; removed before the merge.
        if: matrix.cache && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.head_ref, 'ci/faster-pipeline'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/artifacts
            build/generated
            build/ic-cache
            build/incremental.state
            build/tasks
          key: build-windows-${{ hashFiles('kotlin.bat', 'project.yaml') }}-${{ github.sha }}
      - name: Watch for a hang
        shell: pwsh
        run: >
          Start-Process pwsh -WindowStyle Hidden -ArgumentList
          '-NoProfile', '-File', 'tools/ci/hang-watch.ps1', '-Minutes', $env:HANG_MINUTES, '-OutDir', "$env:RUNNER_TEMP\hang"
      # Below the job's limit: a test that hangs fails this step, whose log is kept (a job out of time loses it).
      - name: Test
        shell: cmd
        timeout-minutes: 25
        env:
          STEPS: ${{ matrix.steps }}
        run: call run-tests.bat --only "%STEPS%"
      # What a hang left: the dumps of the watch, and the processes still alive.
      - name: Dumps and processes left
        if: failure() || cancelled()
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process |
            Where-Object { $_.Name -match '^(java|cmd|conhost|OpenConsole|php|node|rg|git)\.exe$' } |
            ForEach-Object { '{0} {1}<{2} {3}' -f $_.Name, $_.ProcessId, $_.ParentProcessId, $_.CommandLine }
          Get-ChildItem "$env:RUNNER_TEMP\hang" -File -ErrorAction SilentlyContinue | ForEach-Object {
            "===== $($_.Name)"
            Get-Content $_.FullName
          }
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: hang-windows-${{ matrix.id }}
          path: ${{ runner.temp }}/hang
          if-no-files-found: ignore

  # The check the ruleset of main requires: green when every Linux group passed.
  linux:
    name: Linux
    needs: [changes, test-linux]
    if: always() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.test-linux.result }}
        run: |
          echo "Linux groups: $RESULT"
          [ "$RESULT" = success ]

  # The check the ruleset of main requires: green when every Windows module passed.
  windows:
    name: Windows
    needs: [changes, test-windows]
    if: always() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.test-windows.result }}
        run: |
          echo "Windows modules: $RESULT"
          [ "$RESULT" = success ]

  # The only required check: green when every job passed or was skipped.
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, lint, test-linux, linux, test-windows, windows]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
