name: CI

# Runs the strict lint and the whole test suite on every supported platform:
# Ubuntu 20.04, 22.04 and 24.04 (under X11 and Wayland), plus Windows.
# The 20.04 GitHub runner image was retired in April 2025, so older Ubuntu
# versions run in their official container image on an ubuntu-24.04 runner.
#
# A pull request that only touches documentation skips the lint and the tests.
# Branch protection requires the single "CI passed" check, which succeeds when
# every job either passed or was skipped, so such a pull request can merge.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: "1"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      # Pushes and manual runs always test everything.
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE...$HEAD" | tee changed.txt
          if grep -qvE '(\.md$|^docs/)' changed.txt; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint (detekt + ktlint)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # detekt 2.x needs a recent JDK; runners default to an older one.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .detekt
          key: detekt-${{ hashFiles('lint', 'detekt.yml') }}
      - run: ./lint

  test-linux:
    name: Linux ${{ matrix.ubuntu }} · ${{ matrix.session }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:${{ matrix.ubuntu }}
      # An init as PID 1 reaps orphaned processes, as on a real system: tests check that killed processes are gone.
      options: --init
      # The image's default POSIX locale makes the JVM reject non-ASCII file names.
      env:
        LANG: C.UTF-8
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["20.04", "22.04", "24.04"]
        session: [x11, wayland]
    steps:
      # Installed before checkout: the official Ubuntu image has no git, and
      # actions/checkout needs it. The 20.04 repositories may have moved to
      # old-releases, so the sources are switched over if the update fails.
      - name: Install system packages
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update || {
            sed -i \
              -e 's|http://archive.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
              -e 's|http://security.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list
            apt-get update
          }
          apt-get install -y --no-install-recommends \
            ca-certificates curl git tar unzip xz-utils \
            xvfb xauth x11-utils xwayland weston \
            libgl1 libx11-6 libxext6 libxrender1 libxtst6 libxi6 \
            fontconfig fonts-dejavu-core
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.m2/repository
          key: linux-${{ matrix.ubuntu }}-${{ hashFiles('kotlin', 'libs.versions.toml', 'project.yaml', '**/module.yaml') }}
      # ripgrep, downloaded and verified on first use by the server (and its tests).
      - uses: actions/cache@v4
        with:
          path: ~/.kotlin-editor/tools
          key: ripgrep-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('server/src/ripgrep/RipgrepRelease.kt') }}
      - name: Start X11 (Xvfb)
        if: matrix.session == 'x11'
        run: |
          Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp -ac &
          # GITHUB_ENV only applies to the next steps: this one needs DISPLAY too.
          export DISPLAY=:99
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do xdpyinfo >/dev/null 2>&1 && break; sleep 1; done
          xdpyinfo | grep -E "name of display|dimensions"
      - name: Start Wayland (headless Weston + XWayland)
        if: matrix.session == 'wayland'
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          # XWayland refuses to start (and Weston then crashes) without the
          # shared socket directory.
          mkdir -p /tmp/.X11-unix
          chmod 1777 /tmp/.X11-unix
          weston --backend=headless-backend.so --xwayland --socket=wayland-ci \
            --width=1600 --height=1000 --idle-time=0 > "$RUNNER_TEMP/weston.log" 2>&1 &
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=wayland-ci" >> "$GITHUB_ENV"
          # AWT has no Wayland backend: the app goes through XWayland, which
          # Weston composites as a Wayland surface.
          echo "DISPLAY=:0" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            [ -S "$XDG_RUNTIME_DIR/wayland-ci" ] && break
            sleep 1
          done
          test -S "$XDG_RUNTIME_DIR/wayland-ci"
          # Connecting an X client starts XWayland.
          for _ in $(seq 1 30); do xdpyinfo -display :0 >/dev/null 2>&1 && break; sleep 1; done
          xdpyinfo -display :0 | grep -E "name of display|dimensions"
      - name: Build
        run: ./kotlin build
      - name: Test
        # RUNNER_TEMP is the path inside the container; ${{ runner.temp }} is the host's.
        run: JAVA_TOOL_OPTIONS="-XX:ErrorFile=$RUNNER_TEMP/hs_err_%p.log" ./kotlin test
      - name: Display server and JVM crash logs
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/weston.log "$RUNNER_TEMP"/hs_err_*.log; do
            [ -f "$f" ] && { echo "::group::$f"; tail -200 "$f"; echo "::endgroup::"; }
          done
          true
      # The tests render off-screen, so this is what proves the desktop app
      # really starts in the session under test. A timeout (124) means it was
      # still running when killed; any other exit code is a startup failure.
      - name: Desktop app starts in the session
        env:
          SKIKO_RENDER_API: SOFTWARE
        run: |
          set +e
          timeout -k 10 180 ./kotlin run -m desktopApp
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "desktopApp exited with $code before the timeout (expected 124)"
            exit 1
          fi

  test-windows:
    name: Windows
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/AppData/Local/JetBrains/Kotlin/cli
            ~/.m2/repository
          key: windows-${{ hashFiles('kotlin.bat', 'libs.versions.toml', 'project.yaml', '**/module.yaml') }}
      # ripgrep, downloaded and verified on first use by the server (and its tests).
      - uses: actions/cache@v4
        with:
          path: ~/.kotlin-editor/tools
          key: ripgrep-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('server/src/ripgrep/RipgrepRelease.kt') }}
      - name: Build
        shell: cmd
        run: kotlin.bat build
      - name: Test
        shell: cmd
        run: kotlin.bat test

  # The only required check: green when every job passed or was skipped.
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, lint, test-linux, test-windows]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
