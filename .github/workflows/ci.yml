name: CI

# Runs the strict lint and the whole test suite on every supported platform:
# Ubuntu 20.04, 22.04 and 24.04 (under X11 and Wayland), plus Windows.
# The 20.04 GitHub runner image was retired in April 2025, so older Ubuntu
# versions run in their official container image on an ubuntu-24.04 runner.
#
# Each Ubuntu version and session runs the tests in a few jobs side by side,
# one per group of tools/ci/linux-test-groups.txt. A pull request runs two of
# the six (the oldest and newest Ubuntu, one session each), or all six when it
# changes code that differs between them; main runs all six after the merge.
#
# A pull request that only touches documentation skips the lint and the tests.
# Branch protection requires the single "CI passed" check, which succeeds when
# every job either passed or was skipped, so such a pull request can merge.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: "1"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      windows-modules: ${{ steps.modules.outputs.modules }}
      linux-matrix: ${{ steps.linux.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The Windows jobs, one per module: non-ui (the modules without UI tests, together), then each UI module.
      - id: modules
        run: |
          modules=$(grep -vE '^[[:space:]]*(#|$)' tools/ui-test-modules.txt | jq -R . | jq -sc '["non-ui"] + .')
          echo "modules=$modules" | tee -a "$GITHUB_OUTPUT"
      # Pushes and manual runs always test everything.
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE...$HEAD" | tee changed.txt
          if grep -qvE '(\.md$|^docs/)' changed.txt; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      # The Linux jobs: each group of tools/ci/linux-test-groups.txt, for each Ubuntu version and display session.
      # A pull request tests the six only when it changes what differs between them: the shells of the terminal,
      # the display, the packaging, the CI itself.
      - id: linux
        run: |
          lines() { grep -vE '^[[:space:]]*(#|$)' "$1"; }
          expected=$( { echo non-ui; lines tools/ui-test-modules.txt; } | sort)
          grouped=$(lines tools/ci/linux-test-groups.txt | tr ',' '\n' | sort)
          if [ "$expected" != "$grouped" ]; then
            echo "::error file=tools/ci/linux-test-groups.txt::each test step must be in exactly one group"
            diff <(echo "$expected") <(echo "$grouped")
            exit 1
          fi
          all='[["20.04","x11"],["20.04","wayland"],["22.04","x11"],["22.04","wayland"],["24.04","x11"],["24.04","wayland"]]'
          combos=$all
          platform='^(\.github/workflows/ci\.yml|tools/linux-vm/|run-tests$|kotlin$|features/terminal/|desktopApp/|packaging/)'
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && ! grep -qE "$platform" changed.txt; then
            combos='[["24.04","x11"],["20.04","wayland"]]'
          fi
          matrix=$(lines tools/ci/linux-test-groups.txt | jq -R . | jq -sc --argjson combos "$combos" '{include: [
            $combos[] as [$ubuntu, $session] | .[] | {
              ubuntu: $ubuntu, session: $session, steps: ., group: (split(",") | join(" + ")),
              app: (split(",") | index("non-ui") != null)
            }
          ]}')
          echo "matrix=$matrix" | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Lint (detekt + ktlint)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # detekt 2.x needs a recent JDK; runners default to an older one.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .detekt
          key: detekt-${{ hashFiles('lint', 'detekt.yml') }}
      # The project's own detekt rules are built with the project's toolchain.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.m2/repository
          key: lint-${{ hashFiles('kotlin', 'libs.versions.toml', 'project.yaml', '**/module.yaml') }}
      - run: ./lint

  test-linux:
    name: Linux ${{ matrix.ubuntu }} · ${{ matrix.session }} · ${{ matrix.group }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:${{ matrix.ubuntu }}
      # An init as PID 1 reaps orphaned processes, as on a real system: tests check that killed processes are gone.
      options: --init
      # The image's default POSIX locale makes the JVM reject non-ASCII file names.
      env:
        LANG: C.UTF-8
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.linux-matrix) }}
    steps:
      # Installed before checkout: the official Ubuntu image has no git, and
      # actions/checkout needs it. The 20.04 repositories may have moved to
      # old-releases, so the sources are switched over if the update fails.
      - name: Install system packages
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update || {
            sed -i \
              -e 's|http://archive.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
              -e 's|http://security.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list
            apt-get update
          }
          apt-get install -y --no-install-recommends \
            ca-certificates curl git tar unzip xz-utils openssh-client fish tcsh \
            xvfb xauth x11-utils xwayland weston \
            libgl1 libx11-6 libxext6 libxrender1 libxtst6 libxi6 \
            fontconfig fonts-dejavu-core
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # In the container, HOME (the ~ of these paths and of the kotlin script, which keeps its own runtime in cli) is
      # /github/home, but the JVM's user.home is /root, from /etc/passwd: the Kotlin CLI puts the JDK, the Maven
      # dependencies (.m2.cache) and its downloads there, and the server its ripgrep.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/JetBrains/Kotlin/cli
            /root/.cache/JetBrains/Kotlin
            !/root/.cache/JetBrains/Kotlin/telemetry
            /root/.m2/repository
          key: linux-${{ matrix.ubuntu }}-${{ hashFiles('kotlin', 'libs.versions.toml', 'project.yaml', '**/module.yaml') }}
      # ripgrep, downloaded and verified on first use by the server (and its tests).
      - uses: actions/cache@v6
        with:
          path: /root/.kotlin-editor/tools
          key: ripgrep-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('server/src/ripgrep/RipgrepRelease.kt') }}
      - name: Start X11 (Xvfb)
        if: matrix.session == 'x11'
        run: |
          Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp -ac &
          # GITHUB_ENV only applies to the next steps: this one needs DISPLAY too.
          export DISPLAY=:99
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do xdpyinfo >/dev/null 2>&1 && break; sleep 1; done
          xdpyinfo | grep -E "name of display|dimensions"
      - name: Start Wayland (headless Weston + XWayland)
        if: matrix.session == 'wayland'
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          # XWayland refuses to start (and Weston then crashes) without the
          # shared socket directory.
          mkdir -p /tmp/.X11-unix
          chmod 1777 /tmp/.X11-unix
          weston --backend=headless-backend.so --xwayland --socket=wayland-ci \
            --width=1600 --height=1000 --idle-time=0 > "$RUNNER_TEMP/weston.log" 2>&1 &
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=wayland-ci" >> "$GITHUB_ENV"
          # AWT has no Wayland backend: the app goes through XWayland, which
          # Weston composites as a Wayland surface.
          echo "DISPLAY=:0" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            [ -S "$XDG_RUNTIME_DIR/wayland-ci" ] && break
            sleep 1
          done
          test -S "$XDG_RUNTIME_DIR/wayland-ci"
          # Connecting an X client starts XWayland.
          for _ in $(seq 1 30); do xdpyinfo -display :0 >/dev/null 2>&1 && break; sleep 1; done
          xdpyinfo -display :0 | grep -E "name of display|dimensions"
      - name: Build
        run: ./kotlin build
      - name: Test
        # RUNNER_TEMP is the path inside the container; ${{ runner.temp }} is the host's.
        env:
          STEPS: ${{ matrix.steps }}
        run: JAVA_TOOL_OPTIONS="-XX:ErrorFile=$RUNNER_TEMP/hs_err_%p.log" ./run-tests --only "$STEPS"
      - name: Display server and JVM crash logs
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/weston.log "$RUNNER_TEMP"/hs_err_*.log; do
            [ -f "$f" ] && { echo "::group::$f"; tail -200 "$f"; echo "::endgroup::"; }
          done
          true
      # The tests render off-screen, so this is what proves the desktop app
      # really starts in the session under test. A timeout (124) means it was
      # still running when killed; any other exit code is a startup failure.
      # Its JVM is up about 15 s after the command (a JBR download included):
      # a minute leaves room for a crash at startup to show.
      - name: Desktop app starts in the session
        if: matrix.app
        env:
          SKIKO_RENDER_API: SOFTWARE
        run: |
          set +e
          timeout -k 10 60 ./kotlin run -m desktopApp
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "desktopApp exited with $code before the timeout (expected 124)"
            exit 1
          fi

  # One job per module, as run-tests.bat runs them one after the other: a module that hangs (issue #120) fails its
  # own job, with its log and the dumps of the hang watch, and the modules run side by side.
  test-windows:
    name: Windows · ${{ matrix.module }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.windows-modules) }}
    env:
      # A module takes up to about 15 minutes on a runner: past this, its run is taken as hung.
      HANG_MINUTES: "25"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The whole Kotlin cache, not only cli: the JDK (download.cache, extract.cache) and the Maven dependencies
          # (.m2.cache) are next to it.
          path: |
            ~/AppData/Local/JetBrains/Kotlin
            !~/AppData/Local/JetBrains/Kotlin/telemetry
            ~/.m2/repository
          key: windows-${{ hashFiles('kotlin.bat', 'libs.versions.toml', 'project.yaml', '**/module.yaml') }}
      # ripgrep, downloaded and verified on first use by the server (and its tests).
      - uses: actions/cache@v6
        with:
          path: ~/.kotlin-editor/tools
          key: ripgrep-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('server/src/ripgrep/RipgrepRelease.kt') }}
      - name: Build
        shell: cmd
        run: kotlin.bat build
      - name: Watch for a hang
        shell: pwsh
        run: >
          Start-Process pwsh -WindowStyle Hidden -ArgumentList
          '-NoProfile', '-File', 'tools/ci/hang-watch.ps1', '-Minutes', $env:HANG_MINUTES, '-OutDir', "$env:RUNNER_TEMP\hang"
      # Below the job's limit: a test that hangs fails this step, whose log is kept (a job out of time loses it).
      - name: Test
        shell: cmd
        timeout-minutes: 35
        env:
          MODULE: ${{ matrix.module }}
        run: |
          setlocal enabledelayedexpansion
          set args=-m %MODULE%
          if "%MODULE%"=="non-ui" (
            set args=
            for /f "eol=# tokens=*" %%m in (tools\ui-test-modules.txt) do set args=!args! --exclude-module %%m
          )
          call kotlin.bat test !args!
      # What a hang left: the dumps of the watch, and the processes still alive.
      - name: Dumps and processes left
        if: failure() || cancelled()
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process |
            Where-Object { $_.Name -match '^(java|cmd|conhost|OpenConsole|php|node|rg|git)\.exe$' } |
            ForEach-Object { '{0} {1}<{2} {3}' -f $_.Name, $_.ProcessId, $_.ParentProcessId, $_.CommandLine }
          Get-ChildItem "$env:RUNNER_TEMP\hang" -File -ErrorAction SilentlyContinue | ForEach-Object {
            "===== $($_.Name)"
            Get-Content $_.FullName
          }
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: hang-windows-${{ matrix.module }}
          path: ${{ runner.temp }}/hang
          if-no-files-found: ignore

  # The check the ruleset of main requires: green when every Linux group passed.
  linux:
    name: Linux
    needs: [changes, test-linux]
    if: always() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.test-linux.result }}
        run: |
          echo "Linux groups: $RESULT"
          [ "$RESULT" = success ]

  # The check the ruleset of main requires: green when every Windows module passed.
  windows:
    name: Windows
    needs: [changes, test-windows]
    if: always() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.test-windows.result }}
        run: |
          echo "Windows modules: $RESULT"
          [ "$RESULT" = success ]

  # The only required check: green when every job passed or was skipped.
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, lint, test-linux, linux, test-windows, windows]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
