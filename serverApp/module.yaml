product: jvm/app

dependencies:
  - //server
  - //plugins/agent/agent-server
  - //plugins/deploy/deploy-server
  - //plugins/git/git-server
  - //plugins/language-servers/language-servers-server
  - //plugins/run/run-server
  - //plugins/terminal/terminal-server
  - $libs.kotlinx.coroutines.core

settings:
  jvm:
    mainClass: org.example.kotlineditor.server.MainKt

plugins:
  packaging:
    enabled: true
    name: kotlin-editor-server
    displayName: Kotlin Editor server
    mainClass: org.example.kotlineditor.server.MainKt
    description: Kotlin Editor server, for remote use
    vendor: Kotlin Editor
    console: true
    installer: false
