product:
  type: jvm/lib

dependencies:
  - //plugin-host: exported
  - //features/agent: exported
  - //features/editor: exported
  - //features/git: exported
  - //features/language-servers: exported
  - //features/remote: exported
  - //features/run: exported
  - //features/terminal: exported
  - //features/tree: exported
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose

settings:
  compose: enabled

test-dependencies:
  - //e2e

test-settings:
  jvm:
    test:
      freeJvmArgs:
        - --enable-native-access=ALL-UNNAMED
