product:
  type: jvm/lib

dependencies:
  - //ui/kit: exported
  - //ui/editor: exported
  - //ui/git: exported
  - //ui/language-servers: exported
  - //ui/remote: exported
  - //ui/terminal: exported
  - //ui/tree: exported
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose

settings:
  compose: enabled

test-dependencies:
  - //server
  - //lsp
  - //testkit
  - //remote-ssh
  - $compose.uiTest
  - $compose.desktop.currentOs
  - $libs.tree.sitter.kotlin
  - $libs.tree.sitter.json
  # A real SSH server for the remote development end-to-end tests; the client is the system OpenSSH.
  - $libs.sshd.core
  - $libs.sshd.sftp

test-settings:
  jvm:
    test:
      freeJvmArgs:
        - --enable-native-access=ALL-UNNAMED
