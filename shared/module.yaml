product:
  type: jvm/lib

dependencies:
  - //ui/kit: exported
  - //ui/editor: exported
  - //ui/git: exported
  - //ui/language-servers: exported
  - //ui/remote: exported
  - //ui/terminal: exported
  - //ui/tree: exported
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose

settings:
  compose: enabled

test-dependencies:
  - //e2e

test-settings:
  jvm:
    test:
      freeJvmArgs:
        - --enable-native-access=ALL-UNNAMED
