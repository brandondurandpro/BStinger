product:
  type: jvm/lib

dependencies:
  - //plugin-host: exported
  - //plugins/agent/agent-client: exported
  - //features/editor: exported
  - //plugins/deploy/deploy-client: exported
  - //plugins/git/git-client: exported
  - //plugins/language-servers/language-servers-client: exported
  - //features/remote: exported
  - //plugins/run/run-client: exported
  - //plugins/terminal/terminal-client: exported
  - //plugins/tree/tree-client: exported
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose

settings:
  compose: enabled

test-dependencies:
  - //e2e

test-settings:
  jvm:
    test:
      freeJvmArgs:
        - --enable-native-access=ALL-UNNAMED
