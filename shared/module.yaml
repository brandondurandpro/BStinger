product:
  type: jvm/lib

dependencies:
  - //protocol: exported
  - //syntax: exported
  - //client-state: exported
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose

settings:
  compose:
    enabled: true
    resources:
      packageName: org.example.kotlineditor.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true

test-dependencies:
  - //server
  - //lsp
  - //testkit
  - //remote-ssh
  - $compose.uiTest
  - $compose.desktop.currentOs
  - $libs.tree.sitter.kotlin
  - $libs.tree.sitter.json
  # A real SSH server for the remote development end-to-end tests; the client is the system OpenSSH.
  - $libs.sshd.core
  - $libs.sshd.sftp

test-settings:
  jvm:
    test:
      freeJvmArgs:
        - --enable-native-access=ALL-UNNAMED
